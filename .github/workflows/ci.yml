name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev libxkbcommon-x11-0
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  node:
    name: Node (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test shim/test/shim.test.js
      - name: Pack the smoke example
        run: node cli/src/index.mjs build examples/smoke --out smoke.pak

  render:
    name: Render (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev libxkbcommon-x11-0 \
            xvfb
      - run: cargo build --release -p kaplay-native-host
      - name: Install the Mesa software renderer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z -OutFile mesa.7z
          7z x mesa.7z -omesa
          Copy-Item mesa/x64/*.dll target/release/
      - name: Render five frames (Linux)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a target/release/kaplay-native-host \
            --script examples/smoke/main.js --dir examples/smoke \
            --window 320x240 --frames 5 --no-steam --no-audio \
            --screenshot smoke.png --screenshot-raw smoke.rgba
      - name: Render five frames (macOS)
        if: runner.os == 'macOS'
        run: |
          target/release/kaplay-native-host \
            --script examples/smoke/main.js --dir examples/smoke \
            --window 320x240 --frames 5 --no-steam --no-audio \
            --screenshot smoke.png --screenshot-raw smoke.rgba
      - name: Render five frames (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          target/release/kaplay-native-host --script examples/smoke/main.js --dir examples/smoke --window 320x240 --frames 5 --no-steam --no-audio --screenshot smoke.png --screenshot-raw smoke.rgba
      - name: Check the screenshot
        shell: bash
        run: |
          test -s smoke.png
          node scripts/check-frame.mjs smoke.rgba 320 240
